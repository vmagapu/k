<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Kutumb</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1513; color: #dfe9e5; font: 16px system-ui, sans-serif; }
  a { color: #4fb8a8; }
</style>
</head>
<body>
<!-- Short-link page: sends https://<user>.github.io/<repo>/#CODE to the Apps Script app with ?t=CODE.
     The code sits after "#", so browsers never send it to GitHub. -->
<p id="msg">Opening the family network…</p>
<script>
(function () {
  var app = "https://script.google.com/macros/s/AKfycbzFcX2kwvDO1vQAQthK9PizpmmCYrvCUWs54_v5L2ngaTEzr1vmfOQDecVgaggDKFbK/exec";
  var code = location.hash.slice(1).replace(/[^A-Za-z0-9_-]/g, '');
  var target = code ? app + '?t=' + code : app;
  location.replace(target);
  var link = document.createElement('a');
  link.href = target;
  link.textContent = 'Open the family network';
  var msg = document.getElementById('msg');
  msg.textContent = 'If nothing happens, ';
  msg.appendChild(link);
})();
</script>
</body>
</html>
